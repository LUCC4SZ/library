<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="shelf" class="shelf" style="border: 1px solid black"></div>
    <button id="show-dialog">Add book</button>
    <dialog id="dialog">
        <p>Add a book to the shelf.</p>
        <form>
            <label for="author-name">Write the name of the author</label>
            <input type="text" id="author-name">
            <label for="book-title">Write the title of the book</label>
            <input type="text" id="book-title">
            <label for="pages-number">Write the number of pages the book has</label>
            <input type="number" id="pages-number">
            <label for="read">Have you read the book?</label>
            <input type="radio" name="answer" id="yes-btn" value="yes">Yes
            <input type="radio" name="answer" id="no-btn" value="no">No
            <button value="cancel" formmethod="dialog">Cancel</button>
            <button value="default" id="confirm-btn">Confirm</button>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
